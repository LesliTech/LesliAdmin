# Continuous integration for the LesliAdmin Rails engine.
name: "Lesli CI"

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ci:
        name: "Test and integrate Rails engine"
        uses: LesliTech/LesliActions/.github/workflows/lesli-ci-engine.yaml@master
        with:
            ruby-version: "3.3.5"
            module-directory: "engines"
            security-path: "."
            run-security: true
            run-integration: true
            run-integration-new: false
            builder-ref: "master"
            lesli-ref: "master"
            actions-ref: "master"
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
